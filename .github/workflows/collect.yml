name: Daten sammeln

on:
  schedule:
    # Jede Stunde. GitHub startet geplante Läufe oft verspätet und lässt bei Last
    # einzelne aus; viele Termine halten die Daten trotzdem frisch.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Rohdaten-Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mobilithek
          key: mobilithek-${{ github.run_id }}
          restore-keys: mobilithek-

      - name: Zertifikat vorbereiten
        id: cert
        env:
          P12_B64: ${{ secrets.MOBILITHEK_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MOBILITHEK_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ]; then
            echo "::notice::Noch kein Mobilithek-Zertifikat hinterlegt – Lauf übersprungen"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          dir="$RUNNER_TEMP/cert"
          mkdir -p "$dir"
          printf '%s' "$P12_B64" | base64 -d > "$dir/client.p12"
          for legacy in "" "-legacy"; do
            if openssl pkcs12 $legacy -in "$dir/client.p12" -passin env:P12_PASSWORD \
                 -clcerts -nokeys -out "$dir/client.crt" 2>/dev/null \
               && openssl pkcs12 $legacy -in "$dir/client.p12" -passin env:P12_PASSWORD \
                 -nocerts -nodes -out "$dir/client.key" 2>/dev/null; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Zertifikat konnte nicht gelesen werden (Secret oder Passwort prüfen)"
          exit 1

      - name: Daten sammeln
        if: steps.cert.outputs.ready == 'true'
        working-directory: collector
        env:
          MOBILITHEK_SUBSCRIPTIONS: ${{ secrets.MOBILITHEK_SUBSCRIPTIONS }}
        run: >-
          python -m ladekrone_collector
          --sources sources.json
          --out ../public
          --cache ../.cache/mobilithek
          --history-url https://uekala.github.io/ladekrone/v1/history.json
          --cert "$RUNNER_TEMP/cert/client.crt"
          --key "$RUNNER_TEMP/cert/client.key"

      - name: Zertifikat entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/cert"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.cert.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.cert.outputs.ready == 'true'
        with:
          path: public

      # Direkt nach dem Hochladen findet deploy-pages das Artefakt manchmal noch
      # nicht („No artifacts named github-pages“). Dann kurz warten und einmal
      # neu versuchen, statt die gesammelten Daten zu verwerfen.
      - id: deploy
        if: steps.cert.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Vor dem zweiten Versuch warten
        if: steps.cert.outputs.ready == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.cert.outputs.ready == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
